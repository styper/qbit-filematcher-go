# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: qbit-filematcher

before:
  hooks:
    # Frontend assets are embedded; must exist before compile.
    - make assets

builds:
  - id: qbit-filematcher
    main: ./cmd/qbit-filematcher
    binary: qbit-filematcher
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - "386"
    ignore:
      # Match `make build-all` (no linux/darwin 386).
      - goos: linux
        goarch: "386"
      - goos: darwin
        goarch: "386"
    ldflags:
      - -s -w
      - -X {{ .ModulePath }}/cli.Version={{ .Version }}
      - -X {{ .ModulePath }}/web.Version={{ .Version }}

# Archives contain the bare binary (qbit-filematcher / qbit-filematcher.exe).
# Version / OS / arch live only in the archive filename.
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - third_party

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
