{{define "not_found.html"}}
<!DOCTYPE html>
<html lang="en">
  <head>
    {{template "head" .}}
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    {{template "nav" .}}
    <main class="layout-shell py-8">
      <section class="flex min-h-[60vh] flex-col justify-center gap-4">
        <p class="text-sm uppercase tracking-[0.2em] text-rose-400">404</p>
        <h1 class="text-3xl font-semibold tracking-tight">{{.Title}}</h1>
        {{if .Message}}
        <p class="max-w-xl text-slate-400">{{.Message}}</p>
        {{end}}
        {{if .Hash}}
        <p class="font-mono text-xs text-slate-500 break-all">{{.Hash}}</p>
        {{end}}
        <div class="flex gap-3 pt-2">
          <a href="/match" class="rounded bg-cyan-500 px-4 py-2 text-sm font-medium text-slate-950 hover:bg-cyan-400">Back to Match</a>
          <a href="/" class="rounded border border-slate-700 px-4 py-2 text-sm text-slate-200 hover:border-slate-500">Home</a>
        </div>
      </section>
    </main>
  </body>
</html>
{{end}}
